name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install glib-compile-schemas
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Build extension zip
        id: build
        run: |
          set -euo pipefail
          uuid=$(jq -r .uuid metadata.json)
          glib-compile-schemas schemas/
          zip -r "${uuid}.shell-extension.zip" . \
            -x '.git/*' '.github/*' '.gitignore' 'README.md' 'LICENSE' '*.zip'
          echo "zip=${uuid}.shell-extension.zip" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$tag" "${{ steps.build.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
